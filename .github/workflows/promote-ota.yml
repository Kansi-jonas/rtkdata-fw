name: promote-ota

# The Freigabe. Fires only when you PUBLISH a (draft) GitHub Release. It copies
# the release's firmware assets into main/ota/ (the OTA channel the fleet polls)
# and bumps ota/release.json to the release tag. Until you click "Publish
# release", nothing reaches a field device.
#
# Channel URL is hardcoded in the firmware (config.h UPDATE_SERVER_URL ->
# raw.githubusercontent.com/Kansi-jonas/rtkdata-fw/main/ota/), so the channel
# stays on main/ota/ and this works for the already-shipped fleet.

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'rtkdata-fw.bin' -p 'www.bin' -D dl --clobber
          test -f dl/rtkdata-fw.bin
          test -f dl/www.bin
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Verify the binary carries this FW_VERSION
        run: |
          set -euo pipefail
          # Was a warning, so a mismatched binary could still reach the fleet
          # and re-flash in a loop (update.c compares with an exact strcmp).
          #
          # NOT "strings ... | grep -q": under `set -o pipefail` the early exit
          # of grep sends SIGPIPE to strings, the pipeline returns 141 and a
          # perfectly good release FAILS to promote (measured 2026-08-03).
          # Materialise first, then match.
          strings dl/rtkdata-fw.bin > /tmp/fwstrings.txt
          if ! grep -qxF "$VER" /tmp/fwstrings.txt; then
            echo "::error::FW_VERSION string '$VER' not found in the release binary"
            exit 1
          fi

      - name: Write the OTA channel (main/ota/)
        run: |
          set -euo pipefail
          cp dl/rtkdata-fw.bin ota/rtkdata-fw.bin

          # www.bin is shipped ONLY when it actually changed. App and www are
          # not one transaction (the boot partition is selected before www is
          # written), so an unchanged web UI must never be put at risk. For
          # 1.1.4 the two files are byte-identical to the channel's, which is
          # why the manifest below is app-only.
          if cmp -s dl/www.bin ota/www.bin; then
            echo "www.bin unchanged -> app-only update"
            WWW_CHANGED=0
          else
            echo "www.bin changed -> shipping it too"
            cp dl/www.bin ota/www.bin
            WWW_CHANGED=1
          fi

          python3 - "$VER" "$WWW_CHANGED" <<'PY'
          import json, sys
          ver, www = sys.argv[1], sys.argv[2] == "1"
          base = "https://raw.githubusercontent.com/Kansi-jonas/rtkdata-fw/main/ota/"
          d = json.load(open("ota/release.json"))
          d["version"] = ver
          d["update_files_urls"] = [base + "rtkdata-fw.bin"] + ([base + "www.bin"] if www else [])
          json.dump(d, open("ota/release.json", "w"), indent=2)
          open("ota/release.json", "a").write("\n")
          PY
          git config user.name  "rtkdata-ci"
          git config user.email "ci@rtkdata.com"
          git add ota/rtkdata-fw.bin ota/www.bin ota/release.json
          if git diff --cached --quiet; then
            echo "OTA channel already matches ${{ github.event.release.tag_name }}; nothing to publish"
          else
            git commit -m "release: ${{ github.event.release.tag_name }} -> OTA channel (published)"
            git push origin HEAD:main
          fi
