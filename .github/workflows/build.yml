name: build

# CI gate: compile the firmware on every push/PR and expose the OTA artifacts
# (rtkdata-fw.bin + www.bin) as workflow artifacts. This is what makes "source ->
# binaries" reproducible; the release workflow publishes them to the OTA channel.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host tests (all C under -Werror and ASan/UBSan, all Python)
        # One script for CI and local runs, so the gate cannot drift. The
        # sysctl avoids the ASan startup failure on runners with 32 mmap
        # random bits (the script also handles it, this keeps it fast).
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          bash tools/host-tests.sh

      - name: ESP-IDF build (v5.3.1, esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'

      # The K_EVK_V4 Ethernet board (2.x) is a second image from the same tree:
      # own project name, own OTA channel, own sdkconfig in build_eth/.
      - name: ESP-IDF build, Ethernet board (K_EVK_V4, v5.3.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'
          command: idf.py -B build_eth -DRTK_BOARD=k_evk_v4 build

      # Boot gate. The compiler and the host tests both pass on an image that
      # panics in app_main: on 2026-08-01 a reordered init took a semaphore that
      # did not exist yet and every device would have asserted at boot, before
      # the anti-brick guard could count it. This boots the real image in QEMU
      # and fails the build if it does not reach the banner. See
      # tools/qemu-smoke.sh for what it can and cannot cover (no radio, no
      # UM980, no caster).
      - name: QEMU boot smoke test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'
          # Invoke through bash: relying on the file's exec bit made this step
          # fail with "Permission denied" (exit 126) on 2026-08-03, and the
          # release job built a draft anyway because it never ran QEMU.
          command: bash tools/qemu-smoke.sh build

      - name: Collect OTA artifacts
        run: |
          mkdir -p out
          cp build/rtkdata-fw.bin out/
          cp build/www.bin out/
          cp build_eth/rtkdata-fw-eth.bin out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: rtkdata-fw-${{ github.sha }}
          path: out/*.bin
          if-no-files-found: error
