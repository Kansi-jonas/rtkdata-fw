name: build

# CI gate: compile the firmware on every push/PR and expose the OTA artifacts
# (rtkdata-fw.bin + www.bin) as workflow artifacts. This is what makes "source ->
# binaries" reproducible; the release workflow publishes them to the OTA channel.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host tests (tx core + telemetry json)
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Imain/include \
            -o /tmp/test_core tests/host/test_ntrip_tx_core.c \
            main/interface/ntrip_tx_core.c
          /tmp/test_core
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Imain/include -o /tmp/test_core_san tests/host/test_ntrip_tx_core.c \
            main/interface/ntrip_tx_core.c
          /tmp/test_core_san
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Imain/include \
            -o /tmp/test_tj tests/host/test_telemetry_json.c main/telemetry_json.c
          /tmp/test_tj
          gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Imain/include -o /tmp/test_tj_san tests/host/test_telemetry_json.c \
            main/telemetry_json.c
          /tmp/test_tj_san

      - name: ESP-IDF build (v5.3.1, esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'

      # Boot gate. The compiler and the host tests both pass on an image that
      # panics in app_main: on 2026-08-01 a reordered init took a semaphore that
      # did not exist yet and every device would have asserted at boot, before
      # the anti-brick guard could count it. This boots the real image in QEMU
      # and fails the build if it does not reach the banner. See
      # tools/qemu-smoke.sh for what it can and cannot cover (no radio, no
      # UM980, no caster).
      - name: QEMU boot smoke test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'
          command: tools/qemu-smoke.sh build

      - name: Collect OTA artifacts
        run: |
          mkdir -p out
          cp build/rtkdata-fw.bin out/
          cp build/www.bin out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: rtkdata-fw-${{ github.sha }}
          path: out/*.bin
          if-no-files-found: error
